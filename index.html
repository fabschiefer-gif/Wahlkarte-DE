<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Wahlkarte Deutschland – Alle Gemeinden</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111111" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: #f0f2f5;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .maplibregl-ctrl-top-right {
      top: 118px !important;
    }

    .search-bar {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      gap: 6px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      z-index: 10;
    }
    .search-bar:focus-within {
      background: rgba(255, 255, 255, 0.96);
    }
    .search-bar input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      padding: 8px 10px;
      font-size: 16px;
      outline: none;
      color: #111;
    }
    .search-bar button {
      padding: 8px 14px;
      background: #111;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

    .election-switcher {
      position: absolute;
      top: calc(max(12px, env(safe-area-inset-top)) + 56px);
      left: 14px;
      right: 14px;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.10);
      z-index: 10;
    }
    .election-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #333;
      padding: 7px 6px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .election-btn.active {
      background: #111;
      color: #fff;
    }

    .mini-legend {
      position: absolute;
      top: calc(max(12px, env(safe-area-inset-top)) + 106px);
      left: 14px;
      max-width: calc(100% - 72px);
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      z-index: 9;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .toast {
      position: absolute;
      top: calc(max(12px, env(safe-area-inset-top)) + 150px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 17, 17, 0.88);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }
    .toast.visible {
      opacity: 1;
    }

    .upload-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 40px);
      max-width: 390px;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      z-index: 20;
      text-align: center;
    }
    .upload-box.hidden {
      display: none;
    }
    .upload-box h2 {
      margin: 0 0 8px 0;
      font-size: 17px;
    }
    .upload-box p {
      margin: 0 0 14px 0;
      font-size: 13px;
      color: #555;
      line-height: 1.45;
    }
    .upload-btn {
      display: inline-block;
      background: #111;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #fileInput {
      display: none;
    }
    #uploadStatus {
      margin-top: 10px;
      font-size: 12px;
      color: #444;
      font-weight: 500;
    }

    .result-card {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 14px;
      right: 14px;
      max-width: 420px;
      max-height: 46dvh;
      overflow-y: auto;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 16px;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
      z-index: 10;
      transition: transform 0.22s ease, opacity 0.22s ease;
    }
    .result-card.hidden {
      transform: translateY(120%);
      opacity: 0;
      pointer-events: none;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }
    .card-subtitle {
      font-size: 12px;
      color: #666;
      margin: 2px 0 0 0;
    }
    .close-btn {
      background: rgba(0, 0, 0, 0.08);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      color: #333;
      flex-shrink: 0;
    }
    .bar-row {
      margin-bottom: 7px;
    }
    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .bar-track {
      width: 100%;
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Gemeinde oder Stadt suchen..." autocomplete="off" />
    <button type="button" onclick="searchPlace()">Suchen</button>
  </div>

  <div class="election-switcher" role="tablist" aria-label="Wahlart wählen">
    <button type="button" class="election-btn active" role="tab" aria-selected="true" data-election="bundestag" onclick="switchElection('bundestag')">Bundestag</button>
    <button type="button" class="election-btn" role="tab" aria-selected="false" data-election="landtag" onclick="switchElection('landtag')">Landtag</button>
    <button type="button" class="election-btn" role="tab" aria-selected="false" data-election="kommunal" onclick="switchElection('kommunal')">Kommunal</button>
  </div>

  <div class="mini-legend">
    <span><i class="dot" style="background:#111111;"></i>CDU/CSU</span>
    <span><i class="dot" style="background:#009ee0;"></i>AfD</span>
    <span><i class="dot" style="background:#e3000f;"></i>SPD</span>
    <span><i class="dot" style="background:#46962b;"></i>Grüne</span>
    <span><i class="dot" style="background:#be3075;"></i>Linke</span>
    <span><i class="dot" style="background:#f39200;"></i>FW</span>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="uploadBox" class="upload-box hidden">
    <h2>Gemeinde-Daten laden</h2>
    <p>Wähle <strong>gemeinden.geojson</strong> und <strong>ergebnisse.json</strong> aus (nur nötig bei lokalem Öffnen ohne Server).</p>
    <label for="fileInput" class="upload-btn">Beide Dateien auswählen</label>
    <input type="file" id="fileInput" multiple accept=".geojson,.json" />
    <div id="uploadStatus"></div>
  </div>

  <div id="map"></div>

  <div id="resultCard" class="result-card hidden">
    <div class="card-header">
      <div>
        <h2 id="cardTitle" class="card-title">Gemeinde</h2>
        <p id="cardSubtitle" class="card-subtitle">Bundestagswahl</p>
      </div>
      <button type="button" class="close-btn" aria-label="Schließen" onclick="closeCard()">✕</button>
    </div>
    <div id="barsContainer"></div>
  </div>

  <script>
    const ELECTION_KEYS = ['bundestag', 'landtag', 'kommunal'];
    const ELECTION_LABELS = {
      bundestag: 'Bundestagswahl',
      landtag: 'Landtagswahl',
      kommunal: 'Kommunalwahl'
    };

    const PARTY_COLORS = {
      'CDU': '#111111',
      'CSU': '#111111',
      'CDU/CSU': '#111111',
      'AfD': '#009ee0',
      'SPD': '#e3000f',
      'GRÜNE': '#46962b',
      'Grüne': '#46962b',
      'Die Linke': '#be3075',
      'DIE LINKE': '#be3075',
      'Linke': '#be3075',
      'BSW': '#792351',
      'FDP': '#e6b800',
      'FREIE WÄHLER': '#f39200',
      'Freie Wähler': '#f39200',
      'SSW': '#003c8f',
      'Volt': '#502379',
      'Sonstige': '#888888'
    };

    function getPartyColor(name) {
      if (!name) return '#cccccc';
      if (PARTY_COLORS[name]) return PARTY_COLORS[name];
      const upper = name.toUpperCase();
      if (upper.includes('CDU') || upper.includes('CSU')) return '#111111';
      if (upper.includes('AFD')) return '#009ee0';
      if (upper.includes('SPD')) return '#e3000f';
      if (upper.includes('GRÜN')) return '#46962b';
      if (upper.includes('LINKE')) return '#be3075';
      if (upper.includes('BSW')) return '#792351';
      if (upper.includes('FDP')) return '#e6b800';
      if (upper.includes('FREIE WÄHLER')) return '#f39200';
      return '#888888';
    }

    let allResults = { bundestag: {}, landtag: {}, kommunal: {} };
    let currentElection = 'bundestag';
    let currentGeoJSON = null;
    let selectedGemeinde = null;
    let loadedGeoJSON = null;
    let loadedResultsJSON = null;
    let toastTimer = null;

    function showToast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('visible'), 2600);
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm-de': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.de/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap-Mitwirkende'
          }
        },
        layers: [{ id: 'osm-de-layer', type: 'raster', source: 'osm-de' }]
      },
      center: [10.4515, 51.1657],
      zoom: 5.5
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true
    }), 'top-right');

    function normalizeResultsRoot(raw) {
      if (raw && (raw.bundestag || raw.landtag || raw.kommunal)) {
        return {
          bundestag: raw.bundestag || {},
          landtag: raw.landtag || {},
          kommunal: raw.kommunal || {}
        };
      }
      return { bundestag: raw || {}, landtag: {}, kommunal: {} };
    }

    function normalizeEntry(raw) {
      if (!raw) return null;

      if (Array.isArray(raw.parties)) {
        return {
          jahr: raw.jahr || null,
          wahlbeteiligung: null,
          totalValid: raw.totalValid || null,
          parties: raw.parties
        };
      }

      if (raw.parteien && typeof raw.parteien === 'object') {
        const hasSingleUnion = raw.parteien['CDU'] !== undefined || raw.parteien['CSU'] !== undefined;

        const list = Object.entries(raw.parteien)
          .filter(([name, val]) => {
            if (hasSingleUnion && name === 'CDU/CSU') return false;
            return typeof val === 'number' && val > 0;
          })
          .map(([name, val]) => ({ p: name, v: val }))
          .sort((a, b) => b.v - a.v);

        const sum = list.reduce((acc, item) => acc + item.v, 0);
        if (sum > 0 && sum < 99.5) {
          const rest = Math.round((100 - sum) * 10) / 10;
          if (rest >= 0.5) {
            list.push({ p: 'Sonstige', v: rest });
          }
        }

        return {
          jahr: raw.jahr || null,
          wahlbeteiligung: typeof raw.wahlbeteiligung === 'number' ? raw.wahlbeteiligung : null,
          totalValid: null,
          parties: list
        };
      }

      return null;
    }

    function switchElection(type) {
      if (!ELECTION_LABELS[type]) return;
      currentElection = type;

      document.querySelectorAll('.election-btn').forEach(btn => {
        const isActive = btn.dataset.election === type;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', String(isActive));
      });

      if (map.getLayer('gem-fill')) {
        map.setPaintProperty('gem-fill', 'fill-color', ['get', `color_${type}`]);
      }

      if (selectedGemeinde && !document.getElementById('resultCard').classList.contains('hidden')) {
        openGemeindeCard(selectedGemeinde.ags, selectedGemeinde.name, selectedGemeinde.bez);
      }
    }

    function renderGemeinden(geojson, rawResults) {
      allResults = normalizeResultsRoot(rawResults);

      geojson.features = geojson.features.filter(f => {
        const gf = f.properties && f.properties.GF;
        return gf === undefined || gf === null || Number(gf) === 4;
      });

      geojson.features.forEach(feature => {
        const props = feature.properties || {};
        const ags = String(props.AGS || props.ags || '').trim().padStart(8, '0');
        const name = props.GEN || props.gen || props.NAME || 'Unbekannt';
        const bez = props.BEZ || props.bez || 'Gemeinde';

        feature.properties.ags = ags;
        feature.properties.gem_name = name;
        feature.properties.gem_bez = bez;

        ELECTION_KEYS.forEach(type => {
          const entry = normalizeEntry((allResults[type] || {})[ags]);
          feature.properties[`color_${type}`] = (entry && entry.parties.length > 0)
            ? getPartyColor(entry.parties[0].p)
            : '#cccccc';
        });
      });

      currentGeoJSON = geojson;

      if (map.getSource('gemeinden')) {
        map.getSource('gemeinden').setData(currentGeoJSON);
      } else {
        map.addSource('gemeinden', { type: 'geojson', data: currentGeoJSON });

        map.addLayer({
          id: 'gem-fill',
          type: 'fill',
          source: 'gemeinden',
          paint: {
            'fill-color': ['get', `color_${currentElection}`],
            'fill-opacity': ['interpolate', ['linear'], ['zoom'], 5, 0.62, 12, 0.3]
          }
        });

        map.addLayer({
          id: 'gem-border',
          type: 'line',
          source: 'gemeinden',
          paint: {
            'line-color': '#ffffff',
            'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.15, 10, 0.9, 13, 1.8],
            'line-opacity': ['interpolate', ['linear'], ['zoom'], 5, 0.2, 9, 0.85]
          }
        });

        map.addLayer({
          id: 'gem-selected',
          type: 'line',
          source: 'gemeinden',
          filter: ['==', ['get', 'ags'], ''],
          paint: {
            'line-color': '#111111',
            'line-width': ['interpolate', ['linear'], ['zoom'], 5, 1.6, 12, 3.2]
          }
        });

        map.on('click', 'gem-fill', (e) => {
          const props = e.features[0].properties;
          openGemeindeCard(props.ags, props.gem_name, props.gem_bez);
        });

        map.on('mouseenter', 'gem-fill', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'gem-fill', () => map.getCanvas().style.cursor = '');
      }

      document.getElementById('uploadBox').classList.add('hidden');
    }

    function openGemeindeCard(ags, name, bez) {
      selectedGemeinde = { ags, name, bez };
      if (map.getLayer('gem-selected')) {
        map.setFilter('gem-selected', ['==', ['get', 'ags'], ags]);
      }

      const electionData = allResults[currentElection] || {};
      const data = normalizeEntry(electionData[ags]);
      const electionName = ELECTION_LABELS[currentElection] || 'Wahl';

      document.getElementById('cardTitle').textContent = name;

      const container = document.getElementById('barsContainer');
      container.textContent = '';

      if (!data || data.parties.length === 0) {
        document.getElementById('cardSubtitle').textContent = `${electionName} • ${bez}`;
        const msg = document.createElement('p');
        msg.style.cssText = 'font-size:13px;color:#555;margin:6px 0;';
        msg.textContent = `Für dieses Gebiet liegen für die ${electionName} keine eigenen Daten vor.`;
        container.appendChild(msg);
        document.getElementById('resultCard').classList.remove('hidden');
        return;
      }

      const yearText = data.jahr ? ` ${data.jahr}` : '';
      const subParts = [`${electionName}${yearText}`, bez];
      if (data.wahlbeteiligung !== null) {
        subParts.push(`Wahlbet. ${data.wahlbeteiligung.toFixed(1).replace('.', ',')} %`);
      } else if (data.totalValid !== null) {
        subParts.push(`${data.totalValid.toLocaleString('de-DE')} gültige Stimmen`);
      }
      document.getElementById('cardSubtitle').textContent = subParts.join(' • ');

      const maxScale = Math.max(50, ...data.parties.map(item => item.v));

      data.parties.forEach(item => {
        const row = document.createElement('div');
        row.className = 'bar-row';

        const label = document.createElement('div');
        label.className = 'bar-label';

        const partySpan = document.createElement('span');
        partySpan.textContent = item.p;

        const valueSpan = document.createElement('span');
        valueSpan.textContent = `${item.v.toFixed(1).replace('.', ',')} %`;

        label.append(partySpan, valueSpan);

        const track = document.createElement('div');
        track.className = 'bar-track';

        const fill = document.createElement('div');
        fill.className = 'bar-fill';
        fill.style.width = `${Math.min((item.v / maxScale) * 100, 100)}%`;
        fill.style.background = getPartyColor(item.p);

        track.appendChild(fill);
        row.append(label, track);
        container.appendChild(row);
      });

      document.getElementById('resultCard').classList.remove('hidden');
    }

    function closeCard() {
      selectedGemeinde = null;
      if (map.getLayer('gem-selected')) {
        map.setFilter('gem-selected', ['==', ['get', 'ags'], '']);
      }
      document.getElementById('resultCard').classList.add('hidden');
    }

    function getFeatureBounds(geometry) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      function scan(coords) {
        if (typeof coords[0] === 'number') {
          if (coords[0] < minX) minX = coords[0];
          if (coords[0] > maxX) maxX = coords[0];
          if (coords[1] < minY) minY = coords[1];
          if (coords[1] > maxY) maxY = coords[1];
        } else {
          for (let i = 0; i < coords.length; i++) scan(coords[i]);
        }
      }
      if (geometry && geometry.coordinates) scan(geometry.coordinates);
      return [[minX, minY], [maxX, maxY]];
    }

    function findLocalGemeinde(query) {
      if (!currentGeoJSON) return null;
      const q = query.toLowerCase();
      let startsMatch = null;
      for (const f of currentGeoJSON.features) {
        const name = (f.properties.gem_name || '').toLowerCase();
        if (name === q) return f;
        if (!startsMatch && name.startsWith(q)) startsMatch = f;
      }
      return startsMatch;
    }

    async function searchPlace() {
      const input = document.getElementById('searchInput');
      const query = input.value.trim();
      if (!query) return;
      input.blur();

      const localMatch = findLocalGemeinde(query);
      if (localMatch) {
        const props = localMatch.properties;
        const bounds = getFeatureBounds(localMatch.geometry);
        map.fitBounds(bounds, {
          padding: { top: 150, bottom: 260, left: 40, right: 40 },
          maxZoom: 12,
          duration: 800
        });
        openGemeindeCard(props.ags, props.gem_name, props.gem_bez);
        return;
      }

      try {
        const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=1&lang=de&bbox=5.8,47.2,15.1,55.1`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Suche fehlgeschlagen');
        const data = await res.json();

        if (!data.features || data.features.length === 0) {
          showToast('Kein Ort in Deutschland gefunden.');
          return;
        }

        const [lon, lat] = data.features[0].geometry.coordinates;
        map.flyTo({ center: [lon, lat], zoom: 12 });

        map.once('moveend', () => {
          const point = map.project([lon, lat]);
          const features = map.queryRenderedFeatures(point, { layers: ['gem-fill'] });
          if (features.length > 0) {
            const props = features[0].properties;
            openGemeindeCard(props.ags, props.gem_name, props.gem_bez);
          }
        });
      } catch (e) {
        showToast('Suche aktuell nicht erreichbar.');
      }
    }

    map.on('load', async () => {
      try {
        const [geoRes, jsonRes] = await Promise.all([
          fetch('gemeinden.geojson'),
          fetch('ergebnisse.json', { cache: 'no-cache' })
        ]);
        if (!geoRes.ok || !jsonRes.ok) throw new Error('Lokal');
        const geojson = await geoRes.json();
        const results = await jsonRes.json();
        renderGemeinden(geojson, results);
      } catch (e) {
        document.getElementById('uploadBox').classList.remove('hidden');
      }
    });

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const status = document.getElementById('uploadStatus');
      status.textContent = 'Dateien werden eingelesen...';

      for (const file of Array.from(e.target.files)) {
        try {
          const parsed = JSON.parse(await file.text());
          if (parsed.type === 'FeatureCollection') {
            loadedGeoJSON = parsed;
          } else {
            loadedResultsJSON = parsed;
          }
        } catch (err) {
          status.textContent = `Datei konnte nicht gelesen werden: ${file.name}`;
          return;
        }
      }

      if (loadedGeoJSON && loadedResultsJSON) {
        renderGemeinden(loadedGeoJSON, loadedResultsJSON);
      } else {
        const missing = !loadedGeoJSON ? 'gemeinden.geojson' : 'ergebnisse.json';
        status.textContent = `Noch benötigt: ${missing}`;
      }
    });

    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchPlace();
    });
 
  if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>

</body>
</html>
